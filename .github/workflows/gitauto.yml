name: GitAuto

on:
  schedule:
    - cron: "23 22 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test latest episode detection now"
        type: boolean
        default: false

permissions:
  contents: write

# לא מבטלים ריצה באמצע העלאה - ריצה חדשה מחכה לקודמת
concurrency:
  group: gitauto
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set date (Israel time)
        run: echo "TODAY=$(TZ=Asia/Jerusalem date +%F)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run script
        env:
          TEST_SEND: ${{ github.event.inputs.test }}
        run: |
          rm -rf podcasts meta prev out tmp_dl
          mkdir -p podcasts
          python gitauto.py

      - name: Check for new episodes
        id: check
        run: |
          if [ -n "$(find podcasts -mindepth 1 -type f 2>/dev/null | head -n 1)" ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            echo "New episodes found."
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "No new episodes - skipping archive."
          fi

      - name: Create Daily Release
        if: steps.check.outputs.has_new == 'true'
        run: |
          gh release view "$TODAY" >/dev/null 2>&1 || \
          gh release create "$TODAY" \
            --title "$TODAY" \
            --notes "Automated podcast archives for $TODAY grouped by show."

      - name: Download today's existing ZIPs, merge and build
        if: steps.check.outputs.has_new == 'true'
        run: |
          mkdir -p prev out
          gh release download "$TODAY" --dir prev --pattern "*.zip" || true
          python gitauto.py publish

      - name: Upload to Daily Release
        if: steps.check.outputs.has_new == 'true'
        run: |
          shopt -s nullglob
          zips=(out/*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            gh release upload "$TODAY" "${zips[@]}" --clobber
          else
            echo "No new or changed ZIPs to upload."
          fi
          gh release edit "$TODAY" --notes-file out/notes.md

      - name: Delete old daily releases (keep last 30)
        if: steps.check.outputs.has_new == 'true'
        run: |
          # תגים בפורמט YYYY-MM-DD (וגם podcast-YYYY-MM-DD מהפורמט הישן), ממוינים לפי התאריך
          gh release list --limit 200 --json tagName -q '.[].tagName' | \
          grep -E '^(podcast-)?[0-9]{4}-[0-9]{2}-[0-9]{2}$' | \
          awk '{ d=$0; sub(/^podcast-/, "", d); print d, $0 }' | \
          sort | head -n -30 | cut -d' ' -f2 | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting old release: $tag"
              gh release delete "$tag" --cleanup-tag -y || true
            fi
          done

      - name: Save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update state" && git push)
